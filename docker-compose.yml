version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aia331_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=Marketing Campaign Management System with AI
      - APP_ENV=${APP_ENV:-production}
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=sqlite:////app/marketing_campaigns.db
      - SECRET_KEY=${SECRET_KEY:-aia331-super-secret-production-key-change-it}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_BASE_URL=${AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      - AI_MODEL=${AI_MODEL:-gemini-2.5-flash}
      - AI_TIMEOUT_SECONDS=10
      - AI_ENABLE_FALLBACK=true
    volumes:
      - ./backend/marketing_campaigns.db:/app/marketing_campaigns.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - marketing_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aia331_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - marketing_net

networks:
  marketing_net:
    driver: bridge
