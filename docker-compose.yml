# =============================================================================
# MarketFlow v2 — Docker Compose (Môi trường hoàn chỉnh)
#
# Bao gồm:
#   1. postgres: PostgreSQL 16 Alpine
#   2. backend: FastAPI Backend (chạy Alembic migration tự động khi khởi động)
#   3. frontend: React SPA phục vụ bởi Nginx non-root (cổng 80/8080)
#   4. ai-runner (tuỳ chọn): Dịch vụ runner OpenCode CLI (chạy qua profile `runner`)
#
# Cách chạy cơ bản (Postgres + Backend + Frontend):
#   docker compose up -d
#
# Cách chạy kèm AI Runner (yêu cầu cấu hình OpenCode CLI):
#   docker compose --profile runner up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Cơ sở dữ liệu PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: marketflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketflow}
      POSTGRES_USER: ${POSTGRES_USER:-marketflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketflow_secret_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketflow} -d ${POSTGRES_DB:-marketflow}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. FastAPI Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketflow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=MarketFlow
      - APP_ENV=production
      - API_V1_PREFIX=/api/v1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-marketflow}:${POSTGRES_PASSWORD:-marketflow_secret_123}@postgres:5432/${POSTGRES_DB:-marketflow}
      - JWT_SECRET=${JWT_SECRET:-insecure_docker_compose_jwt_secret_32chars_min}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173
      - AI_RUNNER_URL=${AI_RUNNER_URL:-http://ai-runner:8100}
      - AI_RUNNER_TOKEN=${AI_RUNNER_TOKEN:-marketflow_docker_runner_token_secret_32c}
    # Chỉ chạy migration khi khởi động. Dữ liệu mẫu KHÔNG tự nạp (CONTRACT: seed chỉ chạy bằng lệnh tường minh):
    #   docker compose exec backend python seed/seed_demo.py --force
    command: >
      sh -c "alembic upgrade head &&
            uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ---------------------------------------------------------------------------
  # 3. Frontend Web (Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api/v1
    container_name: marketflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------------------
  # 4. AI Runner Service (Profile tuỳ chọn: `runner`)
  # Ghi chú: Chạy OpenCode CLI yêu cầu cài đặt binary opencode và đăng nhập Zen.
  # Khuyến nghị thực tế: chạy dịch vụ systemd trực tiếp trên host/VPS (CONTRACT §11).
  # ---------------------------------------------------------------------------
  ai-runner:
    profiles:
      - runner
    build:
      context: .
      dockerfile: ai-runner/Dockerfile
    container_name: marketflow_ai_runner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - RUNNER_HOST=0.0.0.0
      - RUNNER_PORT=8100
      - RUNNER_TOKEN=${AI_RUNNER_TOKEN:-marketflow_docker_runner_token_secret_32c}
      - OPENCODE_AGENT=marketflow
      - OPENCODE_MODEL=${OPENCODE_MODEL:-opencode/big-pickle}
      - RUNNER_CONCURRENCY=1
      - RUNNER_MAX_QUEUE=8

volumes:
  postgres_data:
