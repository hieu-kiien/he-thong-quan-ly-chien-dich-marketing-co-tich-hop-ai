# =============================================================================
# Security headers - dung chung cho MOI cau hinh co `add_header`.
#
# LY DO TON TAI FILE NAY (loi da kiem chung):
#   Trong nginx, `add_header` CHI duoc KE THUA xuong block con khi block hien tai
#   KHONG co bat ky `add_header` nao. Block
#       location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$
#   co `add_header Cache-Control ...` -> no da TAT KHAI BAO `add_header` rieng ->
#   moi security header dat o `server` level deu KHONG duoc gui cho file tinh
#   (js/css/png/svg/font). Client la JS/CSS cua app thuong chay tren HTTP/2
#   stream rieng, nen header tren tung response 200 do deu "bi mat".
#
#   Giai phap: tach header ra file nay va `include` o CA `server` block LAN
#   `location ~*` block. Khi them header moi, chi sua 1 cho nay.
#
#   GHI CHU VE DUONG DAN: file nay nam o `/etc/nginx/conf.d/`, dung thu muc ma
#   nginx.conf CHINH cua image tu `include /etc/nginx/conf.d/*.conf` trong
#   `http {}`. Nghia la `add_header` o day cung duoc nap o muc `http` (hop le
#   theo nginx) va duoc server/location ke thua. Hai lan `include` ben trong
#   `default.conf` la de CHAC CHAN, vi block nao co `add_header` rieng se mat
#   toan bo ke thua. Dat o `conf.d/` la chu dich: thu muc nay ton tai trong
#   moi image nginx chinh thuc (khong duoc `RUN mkdir` them), va http-level
#   include la mot lop bao ve du phong, khong gay hai.
#
# LUU Y KHI CHINH SUA:
#   - Moi `add_header` deu kem `always` de header van duoc gui tren response
#     loi 4xx/5x (khong chi 2xx/3xx).
#   - Moi thay doi o day se ap dung cho ca 2 file-tinh va route SPA, nen phai
#     kiem tra lai bang `curl -I` tren ca mot file tinh va mot route SPA truoc
#     khi deploy production.
# =============================================================================

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- (2c) KHONG them `X-XSS-Protection` ---
# Header `X-XSS-Protection: 1; mode=block` da bi Chrome, Edge, Firefox, Safari bo
# ho tro (loi bao loi cu, khong con tac dung bao ve) va CHINH LA no gay loi o
# cac trinh duyet cu: bo loc XSS co the lam script noi dung bi chan o cap do
# trinh duyet, gay vong lap that. Khong dung header nay o production.
# Bien phap bao ve XSS DUNG DAC o nam 2026 la Content-Security-Policy duoi day,
# con `X-Content-Type-Options: nosniff` chan MIME sniffing.

# --- (2b) Content-Security-Policy ---
# Script chi chay tu cung origin: chan moi hinh thuc XSS vi HTML/JS ngoai tam
# va chan `data:`/`blob:` la nguon script.
# `style-src 'unsafe-inline'` vi Tailwind + React inject <style> runtime.
# `connect-src 'self' https:` de frontend goi API (qua Cloudflare hoac proxy
# cung origin) va goi dich vu ben ngoai HTTPS.
# `object-src 'none'` chan <object>/<embed> (plugin legacy).
# `frame-ancestors 'self'` la ban sao phong thu cua X-Frame-Options o tren.
#
# KHONG them directive `upgrade-insecure-requests` o day: nginx trong container
# nay chi nghe HTTP (port 8080) sau Cloudflare. Cloudflare da xu ly HTTPS
# -> HTTP -> container. Neu bat directive nay, nginx se sua response cua chinh
# no thanh `https://...` cho asset /api/ ma Cloudflare van tra ve HTTP hop
# le, gay vong lap redirect. Chi bat `upgrade-insecure-requests` o
# Cloudflare Transform Rules (hoac tu Cloudflare "Automatic HTTPS Rewrites")
# o edge, de chi ap dung tren request thuc su den tu internet.
#
# !!! SU LECH SO VOI BAN SPEC GOC - DOC TRUOC KHI XOA !!!
# Ban spec goc dung `style-src 'self' 'unsafe-inline'; font-src 'self' data:`.
# GIA TRI DO SE LAM VO FONT: `frontend/index.html` (ban build Vite, da kiem
# chung bang `npm run build`) tai Google Fonts tu host ngoai:
#     <link rel="preconnect" href="https://fonts.googleapis.com">
#     <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:...">
# va font-file that se den tu `https://fonts.gstatic.com`. Khong khai bao 2 host
# nay thi browser chan stylesheet + woff2, app van chay (khong trang manh) nhung
# mat hoan toan font 'Plus Jakarta Sans' ma `body` dung
# (`class="... font-['Plus_Jakarta_Sans',sans-serif] ..."`) varoi ve system
# sans-serif - la regression hinh anh tren moi trinh duyet.
# -> Da them `https://fonts.googleapis.com` vao `style-src` va
#    `https://fonts.gstatic.com` vao `font-src`. KHONG duyet rong hon bao nhieu
#    (chi 2 host font cua Google), `script-src` van la `'self'` nen XSS van
#    bi chan nhu cu.
# -> MUON BO 2 host nay: truoc het phai self-host font (khong phai sua
#    index.html o commit nay), roi xoa 2 domain khoi dong duoi day.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# --- (2b) HSTS ---
# Chi co gia tri o tren khi request thuc su den bang HTTPS (Cloudflare ->
# https://kienhieu.id.vn). Browser bo qua header nay o HTTP, nen an toàn khi
# dat o tang nginx sau Cloudflare.
# KHONG dung `preload` neu domain chua san sang: preload la thoa thuan
# moi browser, khoa HTTP cua domain vinh vien, thu hoi rat kho.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
