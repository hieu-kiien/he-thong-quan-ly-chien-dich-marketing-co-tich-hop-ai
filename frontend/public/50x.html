<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarketFlow AI — Dịch vụ tạm thời không khả dụng</title>
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 32rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        padding: 2rem 1.75rem;
        box-shadow: 0 10px 30px rgba(15, 23, 42, .08);
      }
      .badge {
        display: inline-block;
        padding: .35rem .7rem;
        border-radius: 999px;
        background: #fef2f2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        font-size: .75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .04em;
      }
      h1 { font-size: 1.35rem; margin: 1rem 0 .5rem; }
      p { margin: 0 0 .75rem; color: #475569; font-size: .9rem; line-height: 1.6; }
      code {
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: .35rem;
        padding: .1rem .35rem;
        font-size: .85em;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
        main { background: #1e293b; border-color: #334155; }
        p { color: #cbd5e1; }
        code { background: #0f172a; border-color: #334155; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Lỗi máy chủ (5xx)</span>
      <h1>MarketFlow AI đang tạm thời không khả dụng</h1>
      <p>
        Máy chủ đã gặp lỗi khi xử lý yêu cầu. Dữ liệu bạn đã nhập vẫn được giữ nguyên —
        hãy tải lại trang sau ít phút.
      </p>
      <p>Nếu tình trạng này kéo dài, hãy thử lại sau 30–60 giây hoặc liên hệ quản trị viên.</p>
      <p><button type="button" onclick="location.reload()">Tải lại trang</button></p>
    </main>
  </body>
</html>
