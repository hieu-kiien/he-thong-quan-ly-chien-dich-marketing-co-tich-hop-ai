# =============================================================================
# nginx.conf - frontend SPA (Vite build) + reverse proxy toi FastAPI backend.
#
# File nay duoc COPY vao `/etc/nginx/conf.d/default.conf` trong image
# `nginxinc/nginx-unprivileged:alpine` (xem frontend/Dockerfile).
#
# GIAI THICH PORT 8080 (thay doi so voi cau hinh cu):
#   Image unprivileged khong chay duoc voi uid < 1010, nen nginx master process
#   khong bind duoc port < 1024. Image do listen mac dinh o 8080. Do vay:
#     - `listen 80` -> `listen 8080`
#     - `EXPOSE 80` -> `EXPOSE 8080` trong Dockerfile
#     - `ports: "3000:80"` -> `"3000:8080"` trong docker-compose.yml
#   Cloudflare / reverse proxy ben ngoai van chi can tro toi 3000, khong doi.
#
# BAO MAT: security headers dat trong file rieng `security-headers.conf` va duoc
# `include` o DUOI day + trong `location ~*` (static assets). Ly do phai include
# o CA HAI cho: xem giai thich day trong `security-headers.conf`.
# =============================================================================

server {
    listen 8080;
    server_name localhost kienhieu.id.vn marketing.kienhieu.id.vn *.kienhieu.id.vn;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers (Production Hardening) - noi dung dung chung, xem file
    # security-headers.conf de biet vi sao phai include ca o server level.
    include /etc/nginx/conf.d/security-headers.conf;

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API endpoints
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # (2d) Shell cua SPA KHONG BAO GIO duoc cache.
    # `location =` ( dau bang) la "exact match": uu tien cao nhat, dung chinh
    # xac file nay va dung block regex static ben duoi. `try_files` la ben
    # trong: neu request la `/index.html` thi serve file that, neu file khong
    # ton tai (truong hop hiem) thi tra 404 chu khong redirect vong ve chinh no.
    #
    # Ly do: `/index.html` la entry point cua SPA. Neu no bi cache, nguoi dung
    # (hoac Cloudflare) co the tai file shell cu cua phien ban truoc, ma file
    # shell do tro toi cac bundle JS/CSS da bi doi hash -> app trang hoac ban
    # chay code cu. `no-store, must-revalidate` cam browser/edge giu lai bat ky
    # ban sao nao, nen moi load luon lay dung version moi nhat.
    # BAT BUOC `include` security-headers.conf o day: block nay co `add_header`
    # Cache-Control nen no TAT KHAI BAO ke thua `add_header` tu `server` level.
    # Ma `location /` phuc vu bang `try_files ... /index.html`, nen moi request
    # mo trang chu deu ROI vao block nay. Thieu include o day -> trang chu khong
    # co security header nao (CSP, HSTS, X-Frame-Options...) du app van chay.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # Cache static assets
    # File tinh co hash trong ten (Vite) -> cache dai (180 ngay) an toan.
    # KHONG dung `expires 6M;`: directive no sinh them mot header Cache-Control
    # rieng, trong khi `add_header` duoi day da tao header thu hai -> browser
    # nhan 2 gia tri Cache-Control trung lap. Chi giu mot noi dung duy nhat.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
        access_log off;
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=15552000, immutable" always;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
