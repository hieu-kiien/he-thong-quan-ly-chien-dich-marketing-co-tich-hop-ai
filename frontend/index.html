<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ thống Quản lý Chiến dịch Marketing tích hợp AI | AIA331</title>

    <!-- SEO cơ bản cho trang công khai duy nhất (trang đăng nhập).
         Lighthouse từng báo "Document does not have a meta description". -->
    <meta
      name="description"
      content="MarketFlow AI là nền tảng điều phối chiến dịch marketing tích hợp AI: lập kế hoạch, phê duyệt nội dung, lịch xuất bản và đo hiệu quả đa kênh trong một nơi duy nhất."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MarketFlow AI — Điều phối chiến dịch marketing tích hợp AI" />
    <meta
      property="og:description"
      content="Lập kế hoạch, phê duyệt, xuất bản và đo hiệu quả chiến dịch marketing đa kênh — có AI hỗ trợ sáng tạo nội dung và chẩn đoán hiệu suất."
    />
    <meta property="og:locale" content="vi_VN" />

    <!-- Plus Jakarta Sans tự host (public/fonts): 2 subset woff2 dùng thật
         của trang — vietnamese + latin. Preload cả hai vì body dùng font này
         ngay dòng đầu; `crossorigin` là bắt buộc với font dù cùng origin. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-vietnamese.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body class="bg-slate-50 text-slate-900 font-['Plus_Jakarta_Sans',sans-serif] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
