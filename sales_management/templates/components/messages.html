{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite" aria-atomic="true">
    {% for message in messages %}
        <div class="toast align-items-center border-0 shadow-sm show text-bg-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="status">
            <div class="d-flex">
                <div class="toast-body">{{ message }}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Đóng"></button>
            </div>
        </div>
    {% endfor %}
</div>
{% endif %}
