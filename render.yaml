# =============================================================================
# Render Blueprint — backend FastAPI của MarketFlow AI
#
# VÌ SAO CẦN FILE NÀY
# Cloudflare Worker chỉ phục vụ frontend tĩnh + proxy /api/*, không chạy được
# backend trong Cloudflare Containers vì tài khoản này không có Workers Paid
# plan (Cloudflare trả 401 "requires the Workers Paid plan").
#
# CÁCH DÙNG
#   1. Render Dashboard → New → Blueprint → chọn repo này.
#   2. Render tạo Postgres + web service trong một lần Apply.
#   3. Điền các giá trị `sync: false` mà Render sẽ báo thiếu:
#      SECRET_KEY, JWT_SECRET_KEY, BYOK_ENCRYPTION_KEY, AI_API_KEY,
#      SCHEDULER_SECRET, và 3 mật khẩu demo.
#   4. Lấy URL service, dán vào BACKEND_ORIGIN trong cloudflare/wrangler.jsonc,
#      rồi `npm run deploy` trong thư mục cloudflare.
#
# HAI GIỚI HẠN NGHIÊM TRỌNG — ĐỌC TRƯỚC KHI DÙNG THẬT
#
#   1. POSTGRES FREE TỰ HẠN SAU 30 NGÀY. Render ghi rõ trên dashboard:
#      "Your database will expire on <ngày +30>. The database will be deleted
#      unless you upgrade to a paid compute plan." Tức là dữ liệu sẽ BỊ XOÁ,
#      không phải chỉ bị khoá. Đây là lý do Render yêu cầu thẻ ở plan Starter.
#      -> Muốn giữ dữ liệu lâu dài: nâng plan Postgres ($6/tháng) hoặc dùng
#         DB ngoài (Neon/Supabase đều có free tier lâu hơn).
#
#   2. WEB SERVICE FREE NGỦ SAU 15 PHÚT KHÔNG CÓ REQUEST. Mỗi lần tỉnh dậy
#      mất khoảng 30-60 giây (cold start). Frontend đã có banner "Máy chủ đang
#      thức dậy" để hiển thị trong lúc chờ.
#      -> Muốn không ngủ: Starter ($7/tháng).
#
# CÁNH BÁO BẢO MẬT
#   `connectionString` của Postgres là thông tin nhạy cảm. Render tự quản lý
#   nó trong dashboard, KHÔNG ghi vào repo. Không bao giờ commit giá trị này.
# =============================================================================

databases:
  - name: marketflow-db
    plan: free
    postgresMajorVersion: "18"
    databaseName: marketflow
    user: marketflow

services:
  - type: web
    name: marketflow-api
    # `runtime` bat buoc theo schema cua Render, va gia tri DUNG cho Docker la
    # `docker`. Dung `runtime: python` se bi Render tu choi: "non-docker runtime
    # python cannot have dockerfilePath"; bo `runtime` thi: "empty but required".
    runtime: docker
    plan: free
    # QUAN TRONG: region cua web service phai trung region cua Postgres.
    # Render free Postgres (plan: free) CHI co o Oregon. Neu web service de o
    # region khac, no lay duoc hostname noi bo cua DB (vi du
    # `dpg-xxxx-a`) va khong DNS-resolve duoc:
    #   sqlalchemy.exc.OperationalError: (psycopg2.OperationalError)
    #   could not translate host name "dpg-xxxx-a" to address:
    #   Name or service not known
    # Da xac nhan bang deploy that: service singapore + DB oregon => /health OK
    # (vi /health khong cham DB) nhung moi endpoint can DB tra 503.
    # Render KHONG doi duoc region cua service da tao, nen phai xoa service roi
    # sync lai blueprint de doi region.
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1

      # Render tu lap connection string tu database khai bao o tren.
      # Khong hardcode: doi ten DB se lam connection string cu cap nhat.
      - key: DATABASE_URL
        fromDatabase:
          name: marketflow-db
          property: connectionString

      # --- AI that: OpenCode Zen ---
      # AI_BASE_URL mac dinh trong config.py la Gemini. Backend tren Render
      # phai tro ve OpenCode de khop voi cai da verify khi chay that.
      - key: AI_PROVIDER
        value: opencode
      - key: AI_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: AI_MODEL
        value: space-bunny-free
      # OpenCode zen phai 83-214 giay cho mot lan goi. Mac dinh 10 giay se
      # fail lien tuc; dat 420 nhu da do khi chay that.
      - key: AI_TIMEOUT_SECONDS
        value: "420"
      - key: AI_ENABLE_FALLBACK
        value: "true"

      # --- Biat khoa gia tri ngay tu Render Dashboard ---
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      # Cron 5 phut/lan cua Worker goi POST /api/v1/schedules/trigger-worker
      # voi header nay. Gia tri phai TRUNG với SCHEDULER_SECRET tren Cloudflare.
      - key: SCHEDULER_SECRET
        sync: false
      - key: MARKETFLOW_MANAGER_PASSWORD
        sync: false
      - key: MARKETFLOW_MARKETER_PASSWORD
        sync: false
      - key: MARKETFLOW_APPROVER_PASSWORD
        sync: false