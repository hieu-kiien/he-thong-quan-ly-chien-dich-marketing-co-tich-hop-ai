# =============================================================================
# Render Blueprint — backend FastAPI của MarketFlow AI
#
# VÌ SAO CẦN FILE NÀY
# Cloudflare Worker chỉ phục vụ frontend tĩnh + proxy /api/*, không chạy được
# backend trong Cloudflare Containers vì tài khoản này không có Workers Paid
# plan (Cloudflare trả 401 "requires the Workers Paid plan").
#
# CÁCH DÙNG
#   1. Render Dashboard → New → Blueprint → chọn repo này.
#   2. Render tạo web service.
#   3. Điền các giá trị `sync: false` mà Render sẽ báo thiếu. **Quan trọng nhất
#      là DATABASE_URL** — xem phần DATABASE bên dưới.
#   4. Lấy URL service, dán vào BACKEND_ORIGIN trong cloudflare/wrangler.jsonc,
#      rồi `npm run deploy` trong thư mục cloudflare.
#
# DATABASE — ĐỌC TRƯỚC KHI DÙNG THẬT
#
#   Blueprint cố tình KHÔNG khai báo `databases:`. Lý do: Render Postgres plan
#   free tự hạn sau 30 ngày và Render ghi rõ trên dashboard:
#     "Your database will expire on <ngày +30>. The database will be deleted
#      unless you upgrade to a paid compute plan."
#   Tức là dữ liệu sẽ BỊ XOÁ, không phải chỉ bị khoá. Khai báo DB trong
#   blueprint khiến người vận hành tưởng là đã có database bền vững.
#
#   -> Hãy dùng Postgres có sở hữu lâu dài: Neon, Supabase, RDS... rồi dán
#      connection string vào DATABASE_URL trong Dashboard.
#
#   `sync: false` ở DATABASE_URL là BẮT BUỘC. Nếu để Render quản lý
#   (`fromDatabase`), lần sync blueprint sau sẽ ghi đè giá trị bạn dán và
#   trỏ về database của Render.
#
#   Lưu ý kỹ thuật khi dùng Neon:
#     - Chọn CÙNG REGION với `region:` của service ( oregon ). Giảm latency.
#     - Dùng endpoint DIRECT, không phải pooled (`-pooler`). psycopg2 >= 2.9
#       dùng prepared statement sau 5 lần execute, còn PgBouncer ở transaction
#       mode không hỗ trợ -> lỗi lúc chạy thật.
#     - Giữ `?sslmode=require` trong connection string.
#
#   Nếu tự dựng Postgres của riêng bạn, nhớ bật `PRAGMA` tương đương cho
#   foreign key. Code đã tự bật khi dùng SQLite; với Postgres thì FK được
#   enforce sẵn ở mức server.
#
# GIỚI HẠN CÒN LẠI
#
#   WEB SERVICE FREE NGỦ SAU 15 PHÚT KHÔNG CÓ REQUEST. Mỗi lần tỉnh dậy mất
#   khoảng 30-60 giây (cold start). Frontend đã có banner "Máy chủ đang thức
#   dậy" để hiển thị trong lúc chờ. Worker có cron */5 phút gọi scheduler nên
#   thường giữ service thức.
#      -> Muốn không ngủ: Starter ($7/tháng).
#
# CÁNH BÁO BẢO MẬT
#   Connection string Postgres là thông tin nhạy cảm. Đặt trong Dashboard với
#   `sync: false`, KHÔNG ghi vào repo. Không bao giờ commit giá trị này.
# =============================================================================

services:
  - type: web
    name: marketflow-api
    # `runtime` bat buoc theo schema cua Render, va gia tri DUNG cho Docker la
    # `docker`. Dung `runtime: python` se bi Render tu choi: "non-docker runtime
    # python cannot have dockerfilePath"; bo `runtime` thi: "empty but required".
    runtime: docker
    plan: free
    # Giu oregon de cung region voi Neon (neu dung Neon) va de gan voi Render
    # Postgres neu ban van dung DB cua Render.
    #
    # Render KHONG doi duoc region cua service da tao. Neu service dang o region
    # khac, phai xoa roi sync lai blueprint.
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1

      # --- DATABASE (bat buoc gan tay) ---
      # Endpoint dang ky co chu dong chan leo thang dac quyen, nen khong co duong
      # nao tao ADMIN qua API. `sync: false` + `app/core/bootstrap_admin.py` la
      # duong duy nhat de co tai khoan ADMIN tren moi deployment.
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false

      # --- AI that: OpenCode Zen ---
      # AI_BASE_URL mac dinh trong config.py la Gemini. Backend tren Render
      # phai tro ve OpenCode de khop voi cai da verify khi chay that.
      - key: AI_PROVIDER
        value: opencode
      - key: AI_BASE_URL
        value: https://opencode.ai/zen/v1
      - key: AI_MODEL
        value: space-bunny-free
      # OpenCode zen phai 83-214 giay cho mot lan goi. Mac dinh 10 giay se
      # fail lien tuc; dat 420 nhu da do khi chay that.
      - key: AI_TIMEOUT_SECONDS
        value: "420"
      - key: AI_ENABLE_FALLBACK
        value: "true"

      # --- Biat khoa gia tri ngay tu Render Dashboard ---
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      # Cron 5 phut/lan cua Worker goi POST /api/v1/schedules/trigger-worker
      # voi header nay. Gia tri phai TRUNG với SCHEDULER_SECRET tren Cloudflare.
      - key: SCHEDULER_SECRET
        sync: false
      # Mat khau cua 3 tai khoan demo. KHONG dung o production: bo cac bien
      # nay va tao tai khoan that qua BOOTSTRAP_ADMIN_* + luong dang ky.
      - key: MARKETFLOW_MANAGER_PASSWORD
        sync: false
      - key: MARKETFLOW_MARKETER_PASSWORD
        sync: false
      - key: MARKETFLOW_APPROVER_PASSWORD
        sync: false
