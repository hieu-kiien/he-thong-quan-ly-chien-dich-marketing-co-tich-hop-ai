name: MarketFlow AI - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Gate 1: Full Backend Test Suite & Security Gate (100% Full Pass)
  # =========================================================================
  backend-security-unit:
    name: "Gate 1: Full Backend Test Suite & Security Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      DATABASE_URL: sqlite:///./test_marketing.db
      AI_ENABLE_FALLBACK: "true"
      PYTEST_TIMEOUT: "180"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install coverage tooling
        run: pip install pytest-cov pytest-timeout

      - name: Run Full Backend Test Suite (pytest backend/tests/ -v)
        run: pytest backend/tests/ -v --timeout=180 --timeout-method=thread --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  # =========================================================================
  # Gate 2: Frontend Build & Typecheck Gate
  # =========================================================================
  frontend-build-typecheck:
    name: "Gate 2: Frontend Build & Typecheck Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Gate mới: lint + typecheck tách khỏi `npm run build`.
      # Trước đây Gate 2 chỉ chạy `npm run build`, mà script đó là `tsc && vite
      # build` với `strict: false` và KHÔNG có ESLint — nên một loạt lỗi
      # null-safety và lỗi accessibility vẫn merge được với CI xanh.
      - name: Type-check (strict)
        run: npm run typecheck
        working-directory: frontend

      - name: "Lint (ESLint: react-hooks + jsx-a11y)"
        run: npm run lint
        working-directory: frontend

      - name: Build frontend distribution bundle (npm run build)
        run: npm run build
        working-directory: frontend

      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html || (echo "Missing frontend/dist/index.html" && exit 1)
          # file tĩnh mà index.html tham chiếu phải tồn tại, nếu không mỗi lần tải
          # trang đều ghi thêm một 404 vào console.
          test -f frontend/dist/vite.svg || (echo "Missing frontend/dist/vite.svg (index.html tham chiếu tới file này)" && exit 1)
          test -f frontend/dist/50x.html || (echo "Missing frontend/dist/50x.html (nginx error_page trỏ tới file này)" && exit 1)
          echo "Frontend build successfully verified."

  # =========================================================================
  # Gate 3: Playwright E2E Business Flows & Interaction Probes Gate
  #
  # CHAY HAI CHE DO (xem frontend/scripts/start-e2e.mjs):
  #  - E2E_MODE=mock: nhanh, offline, bat loi UI regression tren du lieu gia.
  #  - E2E_MODE=live: backend FastAPI THAT + SQLite THAT, dang nhap that, du lieu
  #    that. Day moi la bang chung he thong thuc su chay.
  # Gate fail neu MOT trong hai che do fail.
  # =========================================================================
  playwright-e2e-business-flows:
    name: "Gate 3: Playwright E2E & Interaction Probes Gate"
    runs-on: ubuntu-latest
    # Live mode phai build frontend + khoi dong uvicorn + nap seed truoc khi test
    # chay, nên budget phai lon hon mock mode.
    timeout-minutes: 25

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      DATABASE_URL: sqlite:///./data/marketing_campaigns.db
      AI_ENABLE_FALLBACK: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12 (cho backend that o E2E_MODE=live)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers with system dependencies (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Seed database that (idempotent) cho E2E_MODE=live
        working-directory: backend
        run: |
          mkdir -p data
          python seed/seed_data.py
          echo "::notice title=Seed data::Da nap du lieu mau (manager@gmail.com / Manager@123 vao se)"

      - name: Build frontend preview bundle
        run: npm run build
        working-directory: frontend

      - name: Log E2E modes that su chay
        run: |
          echo "=============================================================="
          echo " Gate 3 - Playwright E2E"
          echo "   Lan chay 1: E2E_MODE=mock  -> du lieu gia, khong backend, nhanh"
          echo "               (tests/e2e/*.spec.ts; live spec + probe tu skip)"
          echo "   Lan chay 2: E2E_MODE=live  -> uvicorn that + SQLite that, KHONG intercept API"
          echo "               (probe backend-health + live-backend.spec.ts)"
          echo "   Backend that: http://127.0.0.1:8000 (do scripts/start-e2e.mjs bat)"
          echo "   Frontend:    http://127.0.0.1:4173 (lan 1) / 4174 (lan 2) / 4175 (probes)"
          echo "=============================================================="

      # Playwright Kiem tra webServer.url TRUOC khi chay command. Neu port con
      # bi giu boi invocation truoc, no abort ngay ("is already used") va
      # scripts/start-e2e.mjs khong bao gio co co hoi dua port. Cap port rieng
      # cho tung invocation la cach loai bo hoan toan xung dot nay.
      - name: Free stale E2E ports before the first run
        run: |
          for p in 4173 4174 4175 4176 4180 8000; do
            fuser -k -9 ${p}/tcp 2>/dev/null || true
          done
          echo "Stale E2E ports cleared."

      # ---------------------------------------------------------------------
      # Lan chay 1: MOCK - toan bo tests/e2e (UI regression nhanh, offline).
      # tests/e2e/live-backend.spec.ts va backend-health.spec.ts tu skip ban thanh.
      # ---------------------------------------------------------------------
      - name: "Playwright run 1/2 - E2E_MODE=mock (tests/e2e)"
        run: npx playwright test tests/e2e --reporter=list
        working-directory: frontend
        env:
          E2E_MODE: mock
          E2E_LOG_MODE: "1"
          E2E_FRONTEND_PORT: "4173"

      # ---------------------------------------------------------------------
      # Lan chay 2: LIVE - backend that, khong intercept API.
      # Chi chay cac spec viet cho du lieu that. Cac spec con lai assert du lieu
      # cua mock-api.ts nen khong co y nghia khi thay bang du lieu that.
      # ---------------------------------------------------------------------
      - name: "Playwright run 2/2 - E2E_MODE=live (backend readiness probe + live-backend.spec.ts)"
        run: npx playwright test tests/e2e/backend-health.spec.ts tests/e2e/live-backend.spec.ts --reporter=list
        working-directory: frontend
        env:
          E2E_MODE: live
          E2E_LOG_MODE: "1"
          E2E_BACKEND_PORT: "8000"
          E2E_FRONTEND_PORT: "4174"
          E2E_PYTHON: python
          PYTHONUNBUFFERED: "1"

      - name: Verify seed data that da san sang (live mode)
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          python - <<'PY'
          import sqlite3, os, sys
          url = os.environ.get("DATABASE_URL", "sqlite:///./data/marketing_campaigns.db")
          path = url.replace("sqlite:///", "", 1)
          print("DATABASE_URL =", url, "->", os.path.abspath(path))
          if not os.path.exists(path):
              print("ERROR: file CSDL khong ton tai")
              sys.exit(1)
          con = sqlite3.connect(path)
          users = [r[0] for r in con.execute("SELECT email FROM users ORDER BY email")]
          print("Users trong CSDL that:", users)
          for required in ("manager@gmail.com", "marketer@gmail.com", "approver@gmail.com"):
              if required not in users:
                  print("ERROR: thieu tai khoan seed", required)
                  sys.exit(1)
          print("OK: du lieu seed cho E2E_MODE=live da san sang.")
          PY

      # Lop polling hang doi AI (frontend/src/services/aiJobPoller.ts) chay
      # trong Node voi dong ho ao va transport gia: KHONG goi mang that, khong
      # goi AI that, khong ton credit. Fail o day thi la loi logic that cua
      # polling (deadline, huy, don submit), khong phai loi ha tang.
      #
      # Cap port rieng (4176) de khong trung port voi cac invocation khac.
      - name: "Playwright unit suite - AI job queue polling (tests/unit)"
        run: npx playwright test tests/unit --reporter=list
        working-directory: frontend
        env:
          E2E_MODE: mock
          E2E_LOG_MODE: "1"
          E2E_FRONTEND_PORT: "4176"

      - name: Run Playwright Visual & Interaction Probes (tests/adversarial-interaction-probes.spec.ts)
        run: npx playwright test tests/adversarial-interaction-probes.spec.ts
        working-directory: frontend
        env:
          E2E_MODE: mock
          E2E_LOG_MODE: "1"
          E2E_FRONTEND_PORT: "4175"

      - name: Upload Playwright E2E artifact report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/
          retention-days: 7

  # =========================================================================
  # Gate 4: WCAG 2.2 AA Accessibility Audit Gate
  #
  # Uu tien chay tren du lieu THAT (E2E_MODE=live). Neu backend that khong
  # khoi dong duoc (mo truong CI doc, port bi chiem...) thi FALLBACK ve mock
  # va ghi ro vao log - khong bao gio "pass" xanh khi khong co gi kiem chung.
  #
  # Cap rieng E2E_FRONTEND_PORT (khac 4173 cua Gate 3) de khong bao gio trung
  # port voi cac invocation Playwright khac trong cung mot workflow.
  #
  # Trang thai hien tai: gate nay XANH tren du lieu that. Hai loi WCAG da duoc
  # sua tai app (khong phai dua test): mau chu text-slate-400 (#94a3b8, tuong
  # phan 2.56:1 tren nen trang) da doi sang text-slate-500 (4.76:1), va 4 vung
  # bang cua chay ngang da duoc them role/aria-label/tabIndex de ban phim
  # truy cap duoc theo WCAG 2.1.1. Ket qua do la 0 violation muc
  # critical/serious tren ca 5 viewport.
  # =========================================================================
  wcag-accessibility-audit:
    name: "Gate 4: WCAG 2.2 AA Accessibility Audit Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      DATABASE_URL: sqlite:///./data/marketing_campaigns.db
      AI_ENABLE_FALLBACK: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python 3.12 (cho backend that o E2E_MODE=live)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers with system dependencies (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Seed database that (idempotent) cho E2E_MODE=live
        working-directory: backend
        run: |
          mkdir -p data
          python seed/seed_data.py

      - name: Build frontend preview bundle
        run: npm run build
        working-directory: frontend

      - name: Log WCAG mode + backend health
        run: |
          echo "=============================================================="
          echo " Gate 4 - WCAG 2.2 AA"
          echo "   Che do uu tien: E2E_MODE=live (du lieu that)"
          echo "   Backend that:   http://127.0.0.1:8000/health"
          echo "   Frontend:       http://127.0.0.1:4180"
          echo "=============================================================="

      - name: "WCAG audit - E2E_MODE=live (readiness probe + wcag.spec.ts)"
        run: npx playwright test tests/e2e/backend-health.spec.ts tests/a11y/wcag.spec.ts --reporter=list
        working-directory: frontend
        env:
          E2E_MODE: live
          E2E_LOG_MODE: "1"
          E2E_BACKEND_PORT: "8000"
          E2E_FRONTEND_PORT: "4180"
          E2E_PYTHON: python
          PYTHONUNBUFFERED: "1"



      - name: Upload WCAG report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-a11y-report
          path: frontend/playwright-report/
          retention-days: 7

  # =========================================================================
  # Gate 5: Performance & API Latency Gate
  # =========================================================================
  performance-load-verify:
    name: "Gate 5: Performance & API Latency Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      DATABASE_URL: sqlite:///./test_marketing.db
      AI_ENABLE_FALLBACK: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run performance and API latency benchmark (measure_api_latency.py)
        run: python scripts/measure_api_latency.py

      - name: Run AI Grounding, Schema Adherence, and Anti-Hallucination benchmark (evaluate_ai_grounding.py)
        run: python scripts/evaluate_ai_grounding.py

      # Tuần 3 mục 4 rubric AIA331: so sánh 3 phiên bản prompt trên tập case
      # cố định. Lời gọi mô hình được stub tất định nên không tốn credit, không
      # cần network, và cho kết quả tái lập được trên mỗi lần chạy CI.
      #
      # Gate này chỉ fail khi script hỏng (không sinh được báo cáo), KHÔNG fail
      # theo kết quả so sánh: v3 có thể thắng v1 hôm nay và thua ngày mai sau khi
      # ta sửa prompt, và đó là dữ liệu chứ không phải lỗi hạ tầng. Cổng chất
      # lượng thật của prompt nằm ở con người đọc bảng trong
      # `docs/PROMPT_VARIANT_COMPARISON.md`.
      - name: Run prompt-variant comparison harness (compare_prompt_variants.py)
        run: |
          python scripts/compare_prompt_variants.py
          test -f docs/PROMPT_VARIANT_COMPARISON.md || (echo "Missing docs/PROMPT_VARIANT_COMPARISON.md" && exit 1)
          test -f scripts/prompt_variant_results.json || (echo "Missing scripts/prompt_variant_results.json" && exit 1)

  # =========================================================================
  # Gate 6: Secret & Dependency Safety
  # =========================================================================
  secret-and-dependency-scan:
    name: "Gate 6: Secret & Dependency Safety"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict || echo "::warning::pip-audit found advisories"
      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found advisories"

  # =========================================================================
  # Gate 7: Cloudflare Worker Typecheck & Config Consistency
  #
  # Worker nằm ngoài backend + frontend nên trước đây không gate nào typecheck nó.
  # Lỗi trong đường Cron chỉ lộ ra lúc deploy — và lỗi so khớp cron là loại
  # im lặng: handler thoát ngay mà không có dấu vết.
  # =========================================================================
  cloudflare-worker-verify:
    name: "Cloudflare Worker Typecheck & Config Consistency"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Node 22, KHÔNG phải 20: wrangler từ bản mới yêu cầu >= v22 và sẽ báo
      # "Wrangler requires at least Node.js v22.0.0" rồi exit 1. Bước
      # `wrangler types` bên dưới vì vậy không chạy được trên Node 20.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        working-directory: cloudflare

      # Worker nằm ngoài backend + frontend nên trước đây KHÔNG có gate nào
      # typecheck nó — lỗi TS trong đường Cron chỉ lộ ra lúc deploy.
      # `worker-configuration.d.ts` là file sinh tự động (không commit) và là nơi
      # wrangler khai báo các global type của runtime: DurableObjectNamespace,
      # R2Bucket, Fetcher, ScheduledController, ExecutionContext. Thiếu bước này
      # thì `tsc` báo "Cannot find name 'R2Bucket'" v.v dù code hoàn toàn đúng.
      - name: Generate Worker types (wrangler types)
        run: npx wrangler types
        working-directory: cloudflare

      - name: Type-check Worker
        run: npx tsc --noEmit
        working-directory: cloudflare

      # Kiểm tra wrangler.jsonc parse được, `SCHEDULER_SECRET` có trong
      # secrets.required, và biểu thức cron mà Worker so khớp có thật sự nằm
      # trong triggers.crons. `controller.cron` là biểu thức cron chứ không phải
      # tên tự đặt; nếu lệch thì scheduled() thoát ngay và lịch đăng trên
      # Cloudflare không bao giờ chạy — lỗi im lặng, chỉ lộ lúc deploy.
      - name: Verify wrangler config & cron consistency
        run: npm run check:config
        working-directory: cloudflare

  # =========================================================================
  # Docker Verification Gate (Requires all gates above to pass)
  # =========================================================================
  docker-verify:
    name: "Docker Build & Compose Verification"
    runs-on: ubuntu-latest
    needs:
      - backend-security-unit
      - frontend-build-typecheck
      - playwright-e2e-business-flows
      - wcag-accessibility-audit
      - performance-load-verify
      - secret-and-dependency-scan
      - cloudflare-worker-verify
    timeout-minutes: 15

    env:
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      APP_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose config

      - name: Build backend and frontend images
        run: docker compose build

      - name: Smoke test container startup
        run: |
          # Ensure database placeholder exists for volume mount
          mkdir -p backend
          touch backend/marketing_campaigns.db && chmod 666 backend/marketing_campaigns.db || true
          docker compose up -d

          echo "Awaiting backend service health (60s timeout)..."
          BACKEND_READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q "healthy"; then
              echo "✅ Backend health check passed on attempt $i."
              BACKEND_READY=1
              break
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done

          if [ "$BACKEND_READY" -ne 1 ]; then
            echo "::error::Backend health check failed after 60 seconds!"
            echo "=== DUMPING BACKEND CONTAINER LOGS ==="
            docker compose logs backend
            docker compose ps
            exit 1
          fi

          echo "Awaiting frontend service readiness (30s timeout)..."
          FRONTEND_READY=0
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "✅ Frontend HTTP check passed on attempt $i."
              FRONTEND_READY=1
              break
            fi
            echo "Waiting for frontend ($i/15)..."
            sleep 2
          done

          if [ "$FRONTEND_READY" -ne 1 ]; then
            echo "::error::Frontend service check failed after 30 seconds!"
            echo "=== DUMPING FRONTEND CONTAINER LOGS ==="
            docker compose logs frontend
            docker compose ps
            exit 1
          fi

          echo "=== DOCKER COMPOSE PROCESS SUMMARY ==="
          docker compose ps

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown containers
        if: always()
        run: docker compose down -v
