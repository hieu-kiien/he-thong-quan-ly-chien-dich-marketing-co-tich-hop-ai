name: MarketFlow v2 — CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - rebuild/v2
  pull_request:
    branches:
      - main
      - master
      - rebuild/v2
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Job 1: Backend Quality & Tests (Ruff Lint + Pytest)
  # =========================================================================
  backend:
    name: "Backend: Ruff Lint & Pytest Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ENV: test
      JWT_SECRET: ci-testing-jwt-secret-key-minimum-32-chars
      DATABASE_URL: sqlite:///./test_marketflow.db
      PYTHONPATH: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff pytest-timeout

      - name: Run Ruff Lint Check
        run: ruff check backend

      - name: Run Backend Pytest Suite
        run: pytest backend/tests -v --timeout=60

  # =========================================================================
  # Job 2: AI Runner Quality & Tests
  # =========================================================================
  ai-runner:
    name: "AI Runner: Pytest Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: ai-runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-runner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-runner/requirements.txt pytest-timeout

      - name: Run AI Runner Tests
        run: pytest ai-runner/tests -v --timeout=30

  # =========================================================================
  # Job 3: Frontend Quality (Typecheck, Lint, Build)
  # =========================================================================
  frontend:
    name: "Frontend: Typecheck, Lint & Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript Typecheck (Strict)
        run: npm run typecheck
        working-directory: frontend

      - name: ESLint (Zero warnings)
        run: npm run lint
        working-directory: frontend

      - name: Vite Build Production Bundle
        run: npm run build
        working-directory: frontend

      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html || (echo "Thiếu tệp frontend/dist/index.html" && exit 1)

  # =========================================================================
  # Job 4: AI Prompt Evaluation (Dry-Run Deterministic Checks)
  # =========================================================================
  assistant-eval:
    name: "AI Assistant: Prompt Evaluation Harness"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Prompt Evaluation Harness (Offline Dry-Run)
        run: python scripts/evaluate_assistant.py --dry-run --all-versions
