name: MarketFlow AI - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      DATABASE_URL: sqlite:///./test_marketing.db
      AI_ENABLE_FALLBACK: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        run: pytest backend/tests -v

      - name: Run supervisory empirical audit suite
        run: python backend/tests/audit_empirical_runner.py

      - name: Run supervisory mutation verifier
        run: python backend/tests/audit_mutation_verifier.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend distribution bundle
        run: npm run build
        working-directory: frontend

      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html || (echo "Missing frontend/dist/index.html" && exit 1)
          echo "Frontend build successfully verified."

  docker-verify:
    name: Docker Build & Compose Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose config

      - name: Build backend and frontend images
        run: docker compose build

      - name: Smoke test container startup
        run: |
          # Ensure database placeholder exists for volume mount
          mkdir -p backend
          touch backend/marketing_campaigns.db && chmod 666 backend/marketing_campaigns.db || true
          docker compose up -d

          echo "Awaiting backend and frontend service health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q "healthy"; then
              echo "Backend health check passed on attempt $i."
              break
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done

          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Frontend HTTP check passed on attempt $i."
              break
            fi
            echo "Waiting for frontend ($i/15)..."
            sleep 2
          done

          docker compose ps

      - name: Teardown containers
        if: always()
        run: docker compose down -v
