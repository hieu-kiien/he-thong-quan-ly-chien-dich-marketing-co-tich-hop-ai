name: MarketFlow AI - CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Gate 1: Full Backend Test Suite & Security Gate (100% Full Pass)
  # =========================================================================
  backend-security-unit:
    name: "Gate 1: Full Backend Test Suite & Security Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      DATABASE_URL: sqlite:///./test_marketing.db
      AI_ENABLE_FALLBACK: "true"
      PYTEST_TIMEOUT: "180"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install coverage tooling
        run: pip install pytest-cov

      - name: Run Full Backend Test Suite (pytest backend/tests/ -v)
        run: pytest backend/tests/ -v --timeout=180 --timeout-method=thread --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=0

  # =========================================================================
  # Gate 2: Frontend Build & Typecheck Gate
  # =========================================================================
  frontend-build-typecheck:
    name: "Gate 2: Frontend Build & Typecheck Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend distribution bundle (npm run build)
        run: npm run build
        working-directory: frontend

      - name: Verify build artifacts
        run: |
          test -f frontend/dist/index.html || (echo "Missing frontend/dist/index.html" && exit 1)
          echo "Frontend build successfully verified."

  # =========================================================================
  # Gate 3: Playwright E2E Business Flows & Interaction Probes Gate
  # =========================================================================
  playwright-e2e-business-flows:
    name: "Gate 3: Playwright E2E & Interaction Probes Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers with system dependencies (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend preview bundle
        run: npm run build
        working-directory: frontend

      - name: Run Playwright E2E business flows (tests/e2e)
        run: npx playwright test tests/e2e
        working-directory: frontend

      - name: Run Playwright Visual & Interaction Probes (tests/adversarial-interaction-probes.spec.ts)
        run: npx playwright test tests/adversarial-interaction-probes.spec.ts
        working-directory: frontend

      - name: Upload Playwright E2E artifact report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: frontend/playwright-report/
          retention-days: 7

  # =========================================================================
  # Gate 4: WCAG 2.2 AA Accessibility Audit Gate
  # =========================================================================
  wcag-accessibility-audit:
    name: "Gate 4: WCAG 2.2 AA Accessibility Audit Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers with system dependencies (Chromium)
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build frontend preview bundle
        run: npm run build
        working-directory: frontend

      - name: Run WCAG accessibility audit (tests/a11y/wcag.spec.ts)
        run: npx playwright test tests/a11y/wcag.spec.ts
        working-directory: frontend

      - name: Upload WCAG report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wcag-a11y-report
          path: frontend/playwright-report/
          retention-days: 7

  # =========================================================================
  # Gate 5: Performance & API Latency Gate
  # =========================================================================
  performance-load-verify:
    name: "Gate 5: Performance & API Latency Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      APP_ENV: test
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      DATABASE_URL: sqlite:///./test_marketing.db
      AI_ENABLE_FALLBACK: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run performance and API latency benchmark (measure_api_latency.py)
        run: python scripts/measure_api_latency.py

  # =========================================================================
  # Gate 6: Secret & Dependency Safety
  # =========================================================================
  secret-and-dependency-scan:
    name: "Gate 6: Secret & Dependency Safety"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict || echo "::warning::pip-audit found advisories"
      - name: npm dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high || echo "::warning::npm audit found advisories"

  # =========================================================================
  # Docker Verification Gate (Requires all 6 gates to pass)
  # =========================================================================
  docker-verify:
    name: "Docker Build & Compose Verification"
    runs-on: ubuntu-latest
    needs:
      - backend-security-unit
      - frontend-build-typecheck
      - playwright-e2e-business-flows
      - wcag-accessibility-audit
      - performance-load-verify
      - secret-and-dependency-scan
    timeout-minutes: 15

    env:
      SECRET_KEY: ci-secret-key-marketflow-ai-testing-32chars
      JWT_SECRET_KEY: ci-jwt-secret-marketflow-ai-testing-32c
      BYOK_ENCRYPTION_KEY: ci-byok-secret-marketflow-ai-testing-32
      APP_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose config

      - name: Build backend and frontend images
        run: docker compose build

      - name: Smoke test container startup
        run: |
          # Ensure database placeholder exists for volume mount
          mkdir -p backend
          touch backend/marketing_campaigns.db && chmod 666 backend/marketing_campaigns.db || true
          docker compose up -d

          echo "Awaiting backend service health (60s timeout)..."
          BACKEND_READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health | grep -q "healthy"; then
              echo "✅ Backend health check passed on attempt $i."
              BACKEND_READY=1
              break
            fi
            echo "Waiting for backend ($i/30)..."
            sleep 2
          done

          if [ "$BACKEND_READY" -ne 1 ]; then
            echo "::error::Backend health check failed after 60 seconds!"
            echo "=== DUMPING BACKEND CONTAINER LOGS ==="
            docker compose logs backend
            docker compose ps
            exit 1
          fi

          echo "Awaiting frontend service readiness (30s timeout)..."
          FRONTEND_READY=0
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "✅ Frontend HTTP check passed on attempt $i."
              FRONTEND_READY=1
              break
            fi
            echo "Waiting for frontend ($i/15)..."
            sleep 2
          done

          if [ "$FRONTEND_READY" -ne 1 ]; then
            echo "::error::Frontend service check failed after 30 seconds!"
            echo "=== DUMPING FRONTEND CONTAINER LOGS ==="
            docker compose logs frontend
            docker compose ps
            exit 1
          fi

          echo "=== DOCKER COMPOSE PROCESS SUMMARY ==="
          docker compose ps

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Teardown containers
        if: always()
        run: docker compose down -v
