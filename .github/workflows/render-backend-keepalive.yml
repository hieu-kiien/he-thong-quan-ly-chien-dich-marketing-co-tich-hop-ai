name: Keep Render backend awake

on:
  schedule:
    - cron: "3/10 * * * *"
  workflow_dispatch:
    inputs:
      health_url:
        description: "Backend health URL, for example https://your-service.onrender.com/health"
        required: false
        type: string

permissions: {}

jobs:
  keep-awake:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BACKEND_HEALTH_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ inputs.health_url || vars.BACKEND_HEALTH_URL }}
        run: |
          if [ -z "$BACKEND_HEALTH_URL" ]; then
            echo "::error::Set BACKEND_HEALTH_URL in repository Actions variables or pass health_url when running manually."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 120 "$BACKEND_HEALTH_URL"
