# Cấu hình Gitleaks — ngoại lệ cho CI Gate 6 (Secret & Dependency Safety).
#
# LƯU Ý: đây KHÔNG phải danh sách bí mật được phép nằm trong repo. Mọi bí mật
# thật đều nằm trong Render env vars và phải tiếp tục bị quét. Mục tiêu của
# ngoại lệ là giữ Gate 6 có ý nghĩa: chỉ bỏ qua đúng một false positive đã
# được xác minh, không mở rộng phạm vi.
#
# Nguồn: commit 692f1c4 làm CI đỏ vì rule `generic-api-key` khớp hai dòng
# trong backend/tests/test_ai_job_queue.py (dòng 701 và 709). Cả hai đều là
# `idempotency_key="orphan-key-001"` — đây là giá trị fixture trong test
# kiểm tra hàng đợi từ chối job thuộc workspace khác, KHÔNG phải khoá API.
#
# Cách sửa đúng: phạm vi ngoại lệ giới hạn theo đường dẫn file, đúng rule
# `generic-api-key`, và đúng chuỗi giá trị đó. Bất kỳ khoá thật nào lọt vào
# file test này vẫn bị báo. Nếu test đổi tên biến hoặc giá trị fixture, ngoại
# lệ này hết tác dụng và Gate 6 đỏ trở lại — đó là hành vi mong muốn.
#
# Cách kiểm tra lại sau khi sửa test:
#   gitleaks detect --config .gitleaks.toml -v

[extend]
# Dùng toàn bộ rule mặc định của Gitleaks 8.x. Không tắt rule nào.
useDefault = true

[[allowlists]]
description = "Fixture idempotency key trong test AI job queue - khong phai khoa API"
paths = [
  '''^backend/tests/test_ai_job_queue\.py$''',
]
# Chỉ áp dụng cho phần giá trị bí mật, không áp dụng cho rule khác hay file khác.
regexTarget = "secret"
regexes = [
  '''^orphan-key-001$''',
]