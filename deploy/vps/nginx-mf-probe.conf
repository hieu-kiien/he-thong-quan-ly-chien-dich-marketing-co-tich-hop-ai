# MarketFlow - vhost kiem tra header do Cloudflare giu cho nginx.
# Chay tren 127.0.0.1:8099, huu ich khi can xac nhan bien CF-Connecting-IP
# thuc su la IP that cua nguoi dung truoc khi dua vao gioi han dang nhap.

server {
    listen 127.0.0.1:8099;
    access_log /var/log/nginx/mfprobe.log;
    location / {
        default_type text/plain;
        return 200 "cf=$http_cf_connecting_ip\ncfip=$http_cf_ipcountry\nxff=$http_x_forwarded_for\nrealip=$http_x_real_ip\n";
    }
}
