# MarketFlow - phuc vu giao dien tinh + chuyen tiep API.
# Cloudflare Tunnel tro toi 127.0.0.1:8080 nen khong mo cong ra ngoai tai day.

upstream marketflow_api {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/marketflow;
    index index.html;

    # API: len toi FastAPI. AI job chay 80-240 giay nen phai khong cat timeout.
    # `^~` la BAT BUOC: no cho prefix nay thang ca moi location regex ben duoi,
    # neu khong thi location chan file thieu se an ca /api/.
    location ^~ /api/ {
        proxy_pass http://marketflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
    }

    location /health {
        proxy_pass http://marketflow_api/api/v1/health;
        proxy_set_header Host $host;
    }

    # Giao dien: file tinh, hash trong ten nen cache dai.
    # Thu muc /var/www/marketflow/assets phai o che do 755, nginx chay bang user
    # khac thi doc duoc. Sai quyen se khien moi file trong assets tra ve 404.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Font tu host (Plus Jakarta Sans variable). Ten file khong hash nen
    # khong dat immutable; nhung van cache dai vi chu de doi rat it lan.
    # Truoc khi them location nay, font bi location / chung (no-cache) an.
    location ^~ /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    # File dung cho bot he thong: robots.txt, sitemap.xml, favicon.ico.
    # KHONG duoc roi xuong fallback SPA ben duoi, vi do bien moi URL thieu
    # (kể cả /api/ nhung do da bi chan o tren) thanh trang HTML 200: bot doc
    # robots.txt nhan ve HTML, Lighthouse bao "robots.txt is not valid".
    location ~* \.(txt|xml|ico|webmanifest)$ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # --- Nen phan hoi ---
    # Brotli truoc (nho hon gzip ~15-20%); neu khach khong ho tro thi nginx
    # tu quay lai gzip duoi day. Module libnginx-mod-http-brotli-filter da
    # cai tren VPS (2026-10-12). Neu chua cai module, bo 2 dong brotli_*.
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/javascript application/javascript
                 application/json application/manifest+json image/svg+xml
                 application/wasm;

    # Vite build ra file text lon (JS ~138 KB, CSS ~95 KB). Khong nen thi
    # moi lan vao trang phai tai ~235 KB trong khi ban nen con ~70 KB.
    # Chi ap dung cho file text; anh/png nen san roi, nen them chi ton CPU.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;
}
