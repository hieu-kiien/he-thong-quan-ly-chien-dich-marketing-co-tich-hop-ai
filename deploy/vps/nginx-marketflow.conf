# MarketFlow v2 — Nginx reverse proxy & static file server.
# Cloudflare Tunnel tro toi 127.0.0.1:8080 nen khong mo cong ra Internet tai day.

upstream marketflow_api {
    server 127.0.0.1:8000 fail_timeout=10s;
    keepalive 8;
}

server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/marketflow;
    index index.html;

    # Deny external access to MCP endpoint (MCP streamable-HTTP is only for internal runner at 127.0.0.1:8000)
    location ^~ /mcp {
        return 404;
    }

    # Streaming SSE cho AI Assistant (/api/v1/assistant/)
    location ^~ /api/v1/assistant/ {
        proxy_pass http://marketflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
        add_header X-Accel-Buffering "no";
    }

    # API v1 va cac endpoint khac cua FastAPI
    location ^~ /api/ {
        proxy_pass http://marketflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 15s;
        proxy_buffering off;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://marketflow_api/health;
        proxy_set_header Host $host;
    }

    # Giao dien: file tinh, hash trong ten nen cache dai.
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Font tu host
    location ^~ /fonts/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    # File dung cho bot he thong: robots.txt, sitemap.xml, favicon.ico.
    location ~* \.(txt|xml|ico|webmanifest)$ {
        try_files $uri =404;
        access_log off;
    }

    # SPA fallback: tra ve index.html voi header no-cache
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # --- Nen phan hoi ---
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css text/javascript application/javascript
                 application/json application/manifest+json image/svg+xml
                 application/wasm;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;
}
